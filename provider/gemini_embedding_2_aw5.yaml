background: '#FCFDFF'
configurate_methods:
  - predefined-model
description:
  en_US: Google Gemini Embedding 2 stable, patched for Dify multimodal knowledge.
extra:
  python:
    model_sources:
      - models/text_embedding/text_embedding.py
    provider_source: provider/gemini_embedding_2_aw5.py
help:
  title:
    en_US: Get an API key from Google AI Studio
  url:
    en_US: https://aistudio.google.com/app/apikey
icon_large:
  en_US: icon_l_en.svg
icon_small:
  en_US: icon_s_en.svg
label:
  en_US: Gemini Embedding 2 (AW5)
models:
  text_embedding:
    position: models/text_embedding/_position.yaml
    predefined:
      - models/text_embedding/*.yaml
provider: gemini_embedding_2_aw5
provider_credential_schema:
  credential_form_schemas:
    - label:
        en_US: API Key
      placeholder:
        en_US: Enter your Gemini API key
      required: true
      type: secret-input
      variable: google_api_key
supported_model_types:
  - text-embedding

